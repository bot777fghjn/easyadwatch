```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyAdWatch</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://api.adsun.io/sdk.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      text-align: center;
      padding: 30px 20px;
      margin: 0;
    }

    .card {
      max-width: 380px;
      margin: 40px auto;
      padding: 25px;
      border-radius: 18px;
      background: #1d293b;
    }

    h1 {
      color: #ffad33;
    }

    p {
      line-height: 1.6;
      color: #d5dbea;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 12px;
      background: #ffad33;
      color: #101827;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 20px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>EasyAdWatch</h1>
    <p>Watch advertisements and earn rewards.</p>
    <p>Watch an eligible advertisement to complete a reward attempt.</p>

    <button id="watchButton" onclick="watchAd()">Watch an Ad</button>

    <p id="status">Ready when you are.</p>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    const statusText = document.getElementById("status");
    const watchButton = document.getElementById("watchButton");

    if (tg) {
      tg.ready();
      tg.expand();
    }

    let adController = null;
    let isWatching = false;

    function setStatus(message) {
      statusText.textContent = message;
    }

    async function watchAd() {
      if (isWatching) return;

      if (!window.Adsun || typeof window.Adsun.init !== "function") {
        setStatus("Ad service is not available. Please try again later.");
        return;
      }

      isWatching = true;
      watchButton.disabled = true;
      setStatus("Loading advertisement...");

      try {
        if (!adController) {
          adController = window.Adsun.init({
            blockId: "50017"
          });
        }

        const result = await adController.show();

        setStatus(
          "Ad completed. Reward confirmation and account credit are not connected yet."
        );

        console.log("Adsun result:", result);
      } catch (error) {
        console.error("Adsun error:", error);
        setStatus(
          "No completed ad was confirmed. Please try again later."
        );
      } finally {
        isWatching = false;
        watchButton.disabled = false;
      }
    }
  </script>
</body>
</html>
