      color: #ffad33;

    button {

<body>
  <div class="card">
    <h1>EasyAdWatch</h1>
    <p>Watch advertisements and earn rewards.</p>
    <p>Welcome! We're preparing the advertising system.</p>

    <button onclick="showStatus()">Watch an Ad</button>

    <p id="status">Advertising is not connected yet.</p>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
    }

    function showStatus() {
      document.getElementById("status").textContent =
        "Ads are not connected yet. No rewards have been earned.";
